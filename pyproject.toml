[project]
name = "festival-sales"
version = "0.1.0"
description = "Diwali sales analysis in pandas and PostgreSQL, with tests that check the two agree"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["festival_sales"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
